{{ define "content" }}
{{ $workers := .UWs }}
{{ $count := .MWorker }}


<script>
    function initSorter(target) {
        let table = new DataTable("#" + target)
    }
</script>

<div>
    <div id="">
        <button onclick="initSorter('ew-table')">SORT</button>
        <!-- search by name -->
        <button hx-post="/edit-workers/add-panel" hx-target="#ew-panel" hx-swap="innerHTML">ADD</button>
        <!-- delete marked -->
        <button>DEL</button>
        <button>APPLY</button>
    </div>

    <div>
        <table id="ew-table">
            <thead>
                <!-- <th>N</th> -->
                <th>FULLNAME</th>
                <th>ROLE</th>
            </thead>
            {{ range $workers }}
            <tr id="ew-{{ .Id }}" hx-post="/edit-workers/edit-{{ .Id }}" hx-target="#ew-panel" hx-swap="innerHTML"
                hx-trigger="click">
                {{ template "ew-row" . }}
            </tr>
            {{ end }}
        </table>
    </div>

    <div>
        <h3>Данные</h3>
        <div id="ew-panel">

        </div>
    </div>
</div>
{{ end }}



{{ define "edit-workers" }}
{{ template "base" . }}
{{ end }}
