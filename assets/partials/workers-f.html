{{ define "workers-row" }}
<tr id="workers-row-{{ .Id }}" hx-post="/workers/edit-{{ .Id }}" hx-target="#workers-panel" hx-swap="innerHTML"
    hx-trigger="click" hx-on:click="$(this).addClass('selrow');$(this).siblings().removeClass('selrow')">
    <td>{{ .W.F_name }} {{ .W.I_name }} {{ .W.O_name }}</td>
    <td>{{ .U.Level }}</td>
</tr>
{{ end }}



{{ define "workers-add" }}
<form hx-post="/workers/add" id="workers-add-f" hx-target="#workers-table-body" hx-swap="beforeend" hx-push-url="false"
    hx-history="false">
    <div>
        <input type="text" name="f_name">
        <input type="text" name="i_name">
        <input type="text" name="o_name">
        <input type="text" name="login" hx-post="/workers/add/tel">
        <div id="workers-add-tel-err">

        </div>
        <input type="text" name="pass" id="workers-pass">
        <button hx-post="/workers/gen" hx-target="#workers-pass" hx-swap="outerHTML">GENERATE PASSWORD</button>
    </div>
    <select name="workers-lvl-sel" hx-post="/workers/sel">
        <option selected disabled value="0">Не выбрано!</option>
        <option value="10">Работник</option>
        <option value="50">Диспетчер</option>
        <option value="100">Администратор</option>
    </select>
    <button type="submit">ADD</button>
</form>
{{ end }}



{{ define "workers-upd" }}
{{ $opts := .Opts }}
<form hx-post="/workers/upd-{{ .Id }}" id="workers-upd-f" hx-target="#workers-row-{{ .Id }}" hx-swap="outerHTML">
    <div>
        <input type="text" name="f_name" value="{{ .W.F_name }}">
        <input type="text" name="i_name" value="{{ .W.I_name }}">
        <input type="text" name="o_name" value="{{ .W.O_name }}">
    </div>
    <select id="workers-lvl-sel" name="workers-lvl-sel">
        {{ range $opts }}
        <option value="{{ .Level }}" {{ if .Sel}} selected {{ end }}>{{ .Name }}</option>
        {{ end }}
    </select>
    <button type="submit">UPD</button>
    <button hx-post="/workers/del-{{ .Id }}" hx-target="#workers-row-{{ .Id }}">DEL</button>
</form>
{{ end }}
