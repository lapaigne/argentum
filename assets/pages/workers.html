{{ define "content" }}
<div class="split-container">
    <div class="left">
        <div id="">
            <button hx-post="/workers/add-panel" hx-target="#workers-panel" hx-swap="innerHTML"
                    hx-on:click="document.querySelector('.right').style.display = 'flex';">ADD</button>
        </div>
        <table class="datatable" id="workers-table">
            <thead>
                <th>FULLNAME</th>
                <th>ROLE</th>
            </thead>
            <tbody id="workers-table-body">
                {{ range . }}
                {{ template "workers-row" . }}
                {{ end }}
            </tbody>
        </table>
    </div>

    <div class="right">
        <button class="close-btn"
                hx-on:click="document.querySelector('.right').style.display = 'none';">❌</button>
        <h3>Данные</h3>
        <div id="workers-panel"></div>
    </div>
</div>
{{ end }}



{{ define "workers" }}
{{ template "base" . }}
{{ end }}
