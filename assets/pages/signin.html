{{ define "signin" }}
{{ template "base" . }}
{{ end }}

{{ define "content" }}
<div class="auth-wrapper">

        <input id="password" type="password" name="pass">

        <button type="submit">Войти</button>
    </form>
</div>
{{ end }}
