{{ define "content" }}
<div class="split-container">
    <div class="left">
        <div id="">
            <button hx-post="/addrs/add-panel" hx-target="#addrs-panel" hx-swap="innerHTML"
                hx-on:click="document.querySelector('.right').style.display = 'flex';">Добавить адрес</button>
            <div class="checkbox-with-text">
                <label for="w-hide">Скрыть отключенные категории</label>
                <input type="checkbox" name="a-hide" id="a-hide" value="1" checked hx-post="/addrs/filter"
                    hx-target="#addrs-table-body" hx-swap="innerHTML" hx-trigger="load, change">
            </div>
        </div>
        <table class="datatable" id="addrs-table">
            <thead>
                <th>Адрес</th>
                <th>Вкл</th>
            </thead>
            <tbody id="addrs-table-body">
                {{ template "addrs-tbody" . }}
            </tbody>
        </table>
    </div>

    <div class="right" style="display: none">
        <div class="close-btn-container">
            <button class="close-btn" hx-on:click="document.querySelector('.right').style.display = 'none';">❌</button>
        </div>
        <h3>Создание/редактирование адреса</h3>
        <div id="addrs-panel"></div>
    </div>
</div>
{{ end }}

{{ define "addrs" }}
{{ template "base" . }}
{{ end }}
